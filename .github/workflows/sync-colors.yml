name: Sync Color Archive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CSV from OneDrive
        env:
          CSV_URL: ${{ secrets.ONEDRIVE_CSV_URL }}
        run: |
          curl -L --output color-archive.csv \
            --url "$CSV_URL" \
            --header "Accept: text/csv" \
            -v 2>&1 | tail -20
          ls -la color-archive.csv
          head -3 color-archive.csv

      - name: Commit and push
        run: |
          git config user.name "btsa-bot"
          git config user.email "bot@btsa.us"
          git add color-archive.csv
          git diff --staged --quiet || git commit -m "Auto-sync color archive"
          git push
