name: Sync Color Archive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download CSV from OneDrive
        run: |
          curl -L "${{ secrets.ONEDRIVE_CSV_URL }}" -o color-archive.csv

      - name: Commit and push
        run: |
          git config user.name "btsa-bot"
          git config user.email "bot@btsa.us"
          git add color-archive.csv
          git diff --staged --quiet || git commit -m "Auto-sync color archive"
          git push
